<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa_Game2555</title>
  <link rel="icon" type="image/jpeg" href="avatar.jpg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="background"></div>
  
  <div class="container">
    <div class="layout-wrapper">
      <div class="center-column">
        <div class="profile-section">
          <img src="avatar.jpg" alt="Avatar" class="avatar">
          <div class="username">Santa2555555</div>
        </div>
        
        <div class="buttons-container">
          <a href="#" class="social-button discord" data-social="discord">
            <i class="fa-brands fa-discord button-icon"></i>
            Discord Server
          </a>
          <a href="#" class="social-button telegram-contact" data-social="telegram-contact">
            <i class="fa-brands fa-telegram button-icon"></i>
            Telegram Contact
          </a>
          <a href="#" class="social-button donation" data-social="donation">
            <img src="donationalerts-Photoroom.png" alt="Donation" class="button-icon">
            Поддержать донатом
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
